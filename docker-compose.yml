services:
  postgres:
    image: postgres:16-alpine
    container_name: pakbooks-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pakbooks
      POSTGRES_PASSWORD: pakbooks
      POSTGRES_DB: pakbooks
    ports:
      - "5432:5432"
    volumes:
      - pakbooks_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pakbooks -d pakbooks"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pakbooks-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  pakbooks_pg:
